name: Secret Scanning Configuration Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-secret-scanning:
    runs-on: ubuntu-latest

    steps:
      - name: Check Secret Scanning configuration
        env:
          GH_TOKEN: ${{ secrets.SECRET_SCANNING_AUDIT_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Audit token is missing."
            exit 1
          fi

          echo "Checking repository configuration..."

          gh api "repos/$REPO" \
            --jq '{
              repository: .full_name,
              visibility: .visibility,
              secret_scanning: (
                .security_and_analysis.secret_scanning.status
                // "not returned"
              ),
              push_protection: (
                .security_and_analysis.secret_scanning_push_protection.status
                // "not returned"
              )
            }'

          echo "Checking access to secret scanning alerts..."

          gh api --paginate --slurp \
            "repos/$REPO/secret-scanning/alerts?state=open&per_page=100" \
            --jq 'add | length' |
          while read -r count; do
            echo "Open secret scanning alerts: $count"
          done

name: Secret Scanning Pattern Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create synthetic test credential
        run: |
          mkdir -p secret-scanning-test
          cat > secret-scanning-test/dummy-token.txt <<'EOF'
          # Synthetic, non-functional test value
          ghp_000000000000000000000000000000000000
          EOF

      - name: Commit test file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add secret-scanning-test/dummy-token.txt
          git commit -m "Add synthetic secret scanning test value" || exit 0
          git push

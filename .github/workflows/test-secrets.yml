name: Secret Scanning Dummy Test

on:
  workflow_dispatch:

permissions:
  contents: write
  security-events: read

jobs:
  test-secret-scanning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add dummy credential
        run: |
          mkdir -p secret-scanning-test
          cat > secret-scanning-test/dummy.txt <<'EOF'
          # Synthetic test data only - not a real credential
          Authorization: Bearer dummy-test-value-not-a-real-token
          EOF

      - name: Commit dummy test file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add secret-scanning-test/dummy.txt
          git commit -m "Test secret scanning with dummy data" || \
            echo "No changes to commit"
          git push

      - name: Wait for scan processing
        run: sleep 30

      - name: Report test status
        run: |
          echo "Dummy credential committed."
          echo "Now check repository Security > Secret scanning."
          echo "Look in Default alerts and Generic alerts."
          echo "No alert yet does not prove a detection failure."
```
